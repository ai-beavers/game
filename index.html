<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Beaver</title>
<style>
  html, body { margin: 0; height: 100%; background: #10141a; overflow: hidden; }
  /* A phone: no pull-to-refresh or rubber band, no text selection, callout or grey flash on a long press or tap. */
  html, body { overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
  canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
  #loading { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px; color: #f6f2e7; font: 15px system-ui, sans-serif; }
  #loading b { font: bold 34px Georgia, serif; }
  #loading .bar { width: min(260px, 60vw); height: 6px; border-radius: 3px; background: rgba(246, 242, 231, 0.15); overflow: hidden; }
  #loading .bar i { display: block; height: 100%; width: 0; background: #f7ca77; transition: width 0.2s; }
  #loading p { margin: 0; opacity: 0.8; }
</style>
<canvas></canvas>
<div id="loading" role="status">
  <b>Beaver</b>
  <div class="bar" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100"><i></i></div>
  <p>Loading the world…</p>
</div>
<script>
// The loading screen. Plain DOM on purpose: the game draws all its UI with Babylon GUI (AGENTS.md), but until the
// code, the physics and the models have arrived (5 MB, seconds on a phone) there is no Babylon to draw with.
// It fetches the big files itself to count their bytes, and src/main.ts waits for window.loading, so the game's own
// requests find them in the browser's cache instead of fetching them again. The production build (tools/build.ts)
// fills in the list, [address, bytes unpacked]; under bun dev it stays empty and only the words show.
window.loading = (async (files) => {
  const box = document.getElementById("loading"), bar = box.querySelector(".bar"), words = box.querySelector("p");
  const total = files.reduce((sum, [, bytes]) => sum + bytes, 0);
  let done = 0;
  bar.hidden = !total;
  new MutationObserver(() => { if (/\bready\b/i.test(document.title)) box.remove(); }).observe(document.querySelector("title"), { childList: true });
  const fail = (e) => { words.textContent = `The game could not start: ${e.reason ?? e.message}`; };
  addEventListener("error", fail);
  addEventListener("unhandledrejection", fail);
  await Promise.all(files.map(async ([url]) => {
    try {
      const reader = (await fetch(url)).body.getReader();
      for (let part; !(part = await reader.read()).done;) {
        done += part.value.length;
        const percent = Math.min(100, Math.round(100 * done / total));
        bar.firstElementChild.style.width = `${percent}%`;
        bar.setAttribute("aria-valuenow", percent);
      }
    } catch {} // the game asks for it again and reports what fails
  }));
  words.textContent = "Starting…";
})([/* files */]);
</script>
<script type="module" src="./src/main.ts"></script>
</html>
